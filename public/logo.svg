<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4891E"/>
      <stop offset="50%" stop-color="#E8A038"/>
      <stop offset="100%" stop-color="#FCBF3A"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCBF3A"/>
      <stop offset="100%" stop-color="#FDD889"/>
    </linearGradient>
    <linearGradient id="g3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8710F"/>
      <stop offset="100%" stop-color="#E8A038"/>
    </linearGradient>
  </defs>

  <!-- Main body curve - sweeping S shape -->
  <path d="M 310 80 C 370 100, 410 160, 390 230 C 370 300, 310 340, 280 390 C 250 440, 230 460, 200 440 C 170 420, 190 380, 220 350 C 250 320, 280 280, 290 230 C 300 180, 270 140, 230 120 C 190 100, 160 130, 170 170"
        stroke="url(#g1)" stroke-width="28" stroke-linecap="round" fill="none"/>

  <!-- Head/claw area -->
  <path d="M 170 170 C 140 200, 100 190, 90 160 C 80 130, 110 100, 150 110"
        stroke="url(#g3)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 150 110 C 170 90, 200 95, 210 120"
        stroke="url(#g3)" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Pincers -->
  <path d="M 90 160 C 60 180, 50 150, 70 130"
        stroke="#8B5509" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 90 160 C 70 190, 90 210, 110 195"
        stroke="#8B5509" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- Flowing tendrils/whiskers -->
  <path d="M 170 170 C 130 220, 80 260, 60 320 C 40 380, 70 400, 100 370"
        stroke="url(#g2)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 200 200 C 160 260, 120 300, 90 360 C 60 420, 80 450, 120 420"
        stroke="url(#g2)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 310 80 C 340 50, 380 60, 370 100"
        stroke="url(#g2)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 340 50 C 370 30, 400 40, 390 80"
        stroke="url(#g2)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Tail fins -->
  <path d="M 200 440 C 170 470, 140 460, 150 430"
        stroke="#8B5509" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 200 440 C 190 480, 160 490, 155 460"
        stroke="#8B5509" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M 200 440 C 220 470, 210 490, 185 480"
        stroke="#B8710F" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Ink dots/splashes -->
  <circle cx="140" cy="460" r="5" fill="#8B5509" opacity="0.7"/>
  <circle cx="155" cy="475" r="3" fill="#8B5509" opacity="0.5"/>
  <circle cx="125" cy="470" r="4" fill="#D4891E" opacity="0.6"/>
  <circle cx="170" cy="485" r="3" fill="#8B5509" opacity="0.4"/>
  <circle cx="110" cy="455" r="3" fill="#D4891E" opacity="0.5"/>
  <circle cx="135" cy="490" r="2.5" fill="#B8710F" opacity="0.5"/>

  <!-- Eye -->
  <circle cx="165" cy="155" r="6" fill="#4A2D05"/>
  <circle cx="163" cy="153" r="2" fill="#FCBF3A" opacity="0.7"/>
</svg>
